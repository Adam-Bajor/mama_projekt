<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app" id="app" aria-live="polite">
        <section class="screen home is-active" id="home">
            <div class="home-card">
                <div class="cycle-settings" id="cycleSettings">
                    <label for="cycleStartInput">Start cyklu</label>
                    <input type="date" id="cycleStartInput" aria-label="Data startu cyklu" readonly>
                    <button class="change-date-button" type="button" id="changeDateButton">Zmień datę</button>
                </div>
                <div class="home-content">
                    <p class="eyebrow">Tabletka dzisiaj</p>
                    <h1 class="answer" id="todayAnswer">...</h1>
                    <p class="cycle-day" id="todayCycleDay"></p>
                    <div class="status-strip" aria-hidden="true">
                        <span class="status-chip">21 dni tabletki</span>
                        <span class="status-chip">7 dni przerwy</span>
                    </div>
                    <p class="hint">Kliknij, żeby zobaczyć cały miesiąc.</p>
                </div>
            </div>
        </section>

        <section class="screen calendar-screen" id="calendarScreen">
            <header class="calendar-head">
                <div>
                    <h2 class="calendar-title" id="calendarTitle"></h2>
                    <p class="calendar-subtitle" id="calendarSubtitle"></p>
                    <div class="calendar-legend" aria-hidden="true">
                        <span class="legend-item"><span class="legend-dot"></span>Tabletka</span>
                        <span class="legend-item"><span class="legend-dot is-break"></span>Przerwa</span>
                    </div>
                </div>
                <div class="calendar-actions">
                    <button class="current-month-button" type="button" id="currentMonthButton">Obecny miesiąc</button>
                    <button class="next-month-button" type="button" id="nextMonthButton">Następny miesiąc</button>
                </div>
            </header>
            <div class="calendar" id="calendar"></div>
        </section>
    </main>

    <dialog class="date-dialog" id="dateDialog">
        <form id="dateForm">
            <h2>Zmień datę</h2>
            <label>
                Hasło
                <input type="password" id="adminPassword" autocomplete="current-password" required>
            </label>
            <label>
                Nowa data
                <input type="date" id="newCycleStart" required>
            </label>
            <p class="date-dialog-message" id="dateDialogMessage" role="alert"></p>
            <div class="date-dialog-actions">
                <button type="button" id="cancelDateButton">Anuluj</button>
                <button type="submit">Zapisz</button>
            </div>
        </form>
    </dialog>

    <script src="config.js"></script>
    <script src="js/date-utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
