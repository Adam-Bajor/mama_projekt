<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletka</title>
    <style>
        html{
            background-color: rgba(0, 0, 0, 1);
            background-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 0%, rgba(6, 39, 2, 0.8) 5%, rgba(2, 47, 48, 0.8) 95%, rgba(0, 0, 0, 1) 100%);
        }
        body{
            font-family: Garamond;
            color: black;
            padding: 0;
            margin: 0;
        }
        .block{
            height: 207px;
            width: 207px;
            margin: 0.2rem;
            border: solid 2px black;
            border-radius: 10% 10% 10% 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 200%
        }
        .kalendarz{
            display: flex;
            flex-wrap: wrap;
        }
        
        .pierwszy{
            justify-content: center;
            display: flex;
            flex-wrap: wrap;
            font-size: 1880%;
            color: white;
        }
        .drugi{
            display: none;
        }
        .kalendarz p{
            width: 100%;
            color: white;
            font-size: 350%;
            text-align: center;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div onclick="Zmiana()">

        <div class="pierwszy" id="pierwszy"> 

        </div>

        <div class="drugi" id="drugi">
            <div class="kalendarz"> </div>
        </div>

    </div>
        
<!-- Pirewsza strona -->
    <script>
        // Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec
            teraz = new Date();
            dzien = new Date("Jul 21 2024 0:0:00");
            sekund = Math.abs(teraz-dzien)/1000;
            minut = parseInt(sekund/60);
            godzin = parseInt(minut/60);
            dni = parseInt(godzin/24);
            lat = parseInt(dni/365);
            console.log(dni)
            let wynik = (dni) % 28;
            console.log(sekund,minut,godzin,dni,lat)
            if (wynik <= 20) {
                wynik=wynik+1;
                const p = document.createElement("div");
                p.innerText = `TAK
                Dzień ${wynik}`; 
                document.querySelector(".pierwszy").appendChild(p); 
            }else{
                wynik=wynik+1;
                const p = document.createElement("div");
                p.innerText = `NIE
                Dzień ${wynik}`; 
                document.querySelector(".pierwszy").appendChild(p); 
            }
            
            
    </script>
<!-- Druga  strona -->
    <script>
        let data = new Date();
        let rok = data.getFullYear();
        let miesiac = data.getMonth();
        let A_dzien = data.getDate();
        let przestepny = rok%4
        let klasa = 1
        let dzienFor = 1
        let LicznikDzien = 1
        let wynik2 = 0

        console.log(dzienFor,A_dzien,)

        switch(miesiac) {
            case 0:
                dzien = 31
                nazwa = "Styczeń"
            break;
            case 1:
                nazwa = "Luty"
                if(przestepny == 0){
                    dzien = 29
                }else(
                    dzien = 28
                )
            break;
            case 2:
                nazwa = "Marzec"
                dzien = 31
            break;
            case 3:
                nazwa = "Kwiecień"
                dzien = 30
            break;
            case 4:
                nazwa = "Maj"
                dzien = 31
            break;
            case 5:
                nazwa = "Czerwiec"
                dzien = 30
            break;
            case 6:
                nazwa = "Lipiec"
                dzien = 31
            break;
            case 7:
                nazwa = "Sierpień"
                dzien = 31
            break;
            case 8:
                nazwa = "Wrzesień"
                dzien = 30
            break;
            case 9:
                nazwa = "Październik"
                dzien = 31
            break;
            case 10:
                nazwa = "Listopad"
                dzien = 30
            break;
            case 11:
                nazwa = "Grudzień"
                dzien = 31
            break;
}  

        const p = document.createElement("p");
        p.innerText = `Kalendarz Miesiąc ${nazwa}`; 
        document.querySelector(".kalendarz").appendChild(p);

        
        dni = dni-A_dzien
        wynik = dni%27

        for (let i = 0; i < dzien; i++) {
            if(dzienFor==A_dzien){
                
                if(wynik < 20){
                    wynik2 = "Tak"
                    wynik = wynik+1 
                }else{
                    wynik2 = "NIE"
                    wynik = wynik+1
                }

                const el = document.createElement("div");

                klasa = "dzien"+LicznikDzien
                LicznikDzien++

                el.classList.add("block");
                el.classList.add(klasa);
                el.style.background = `white`;
                
                el.innerText = 
                `Aktualny 
                Dzień ${wynik+1}
                ${dzienFor++}.${miesiac+1}.${rok}
                Tabletka-${wynik2}`; 

                document.querySelector(".kalendarz").appendChild(el);

                wynik = wynik%27
            }else{
                if(wynik < 20){
                    const el = document.createElement("div");

                    klasa = "dzien"+LicznikDzien
                    LicznikDzien++ 
                    wynik2 = "TAK"
                    wynik = wynik+1

                    el.classList.add("block");
                    el.classList.add(klasa);
                    el.style.background = `rgba(0, 76, 255, 0.4)`;
                    el.style.color = `white`

                    el.innerText = 
                    `${dzienFor++}.${miesiac+1}.${rok}
                    Tabletka-${wynik2}`;

                    document.querySelector(".kalendarz").appendChild(el);
                    wynik = wynik%27
                }else{
                    const el = document.createElement("div");

                    klasa = "dzien"+LicznikDzien
                    LicznikDzien++ 
                    wynik2 = "NIE"
                    wynik = wynik+1

                    el.classList.add("block");
                    el.classList.add(klasa);
                    el.style.background = `rgba(255, 0, 0, 0.4)`;
                    el.style.color = `white`

                    el.innerText = 
                    `${dzienFor++}.${miesiac+1}.${rok}
                    Tabletka-${wynik2}`;

                    document.querySelector(".kalendarz").appendChild(el);
                    wynik = wynik%27
                }
            }
        }


    </script>
    <!-- ZMINA -->
    <script>
        let WynikJeden = 1
        let WynikDwa = 0
        function Zmiana(){
            WynikJeden = (WynikJeden + 1)%2;
            WynikDwa = (WynikDwa + 1)%2;
            if(WynikJeden == 1){
                WynikDisplay1 = "flex"
            }else{
                WynikDisplay1 = "none"
            }
            if(WynikDwa == 1){
                WynikDisplay2 = "flex"
            }else{
                WynikDisplay2 = "none"
            }
            document.getElementById("pierwszy").style.display = WynikDisplay1;
            document.getElementById("drugi").style.display = WynikDisplay2;
        }
    </script>
</body>
</html>
