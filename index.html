<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1117;
            --surface: #131d26;
            --surface-soft: #1b2934;
            --ink: #eef6f5;
            --muted: #91a5ad;
            --line: #2b3b47;
            --yes: #51d49b;
            --yes-soft: #173b35;
            --no: #ff7d79;
            --no-soft: #432a31;
            --today: #72a7ff;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
            --calendar-rows: 6;
            --accent: #62d7c4;
            --accent-soft: #173f42;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, rgba(98, 215, 196, 0.11), transparent 32%),
                radial-gradient(circle at 85% 90%, rgba(114, 167, 255, 0.12), transparent 30%),
                var(--bg);
        }

        button {
            font: inherit;
        }

        .app {
            width: 100%;
            height: 100vh;
            padding: clamp(14px, 3vw, 32px);
            cursor: pointer;
        }

        .screen {
            height: 100%;
            display: none;
        }

        .screen.is-active {
            display: grid;
        }

        .home {
            align-items: stretch;
            justify-items: stretch;
            text-align: center;
            position: relative;
        }

        .home-card {
            position: relative;
            width: min(1080px, 100%);
            min-height: calc(100vh - clamp(28px, 6vw, 64px));
            margin: auto;
            padding: clamp(34px, 6vw, 84px);
            background:
                linear-gradient(135deg, rgba(28, 58, 65, 0.92), rgba(19, 29, 38, 0.94) 52%, rgba(43, 38, 55, 0.92)),
                var(--surface);
            border: 1px solid rgba(145, 165, 173, 0.18);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        .home-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 8px;
            background: linear-gradient(90deg, var(--yes), var(--today), var(--no));
        }

        .home-content {
            width: min(980px, 100%);
            position: relative;
            z-index: 1;
        }

        .cycle-settings {
            position: absolute;
            top: clamp(12px, 2vw, 22px);
            right: clamp(12px, 2vw, 22px);
            z-index: 2;
            display: grid;
            width: min(160px, calc(100vw - 32px));
            padding: 0;
            text-align: left;
            background: transparent;
            border: 0;
            box-shadow: none;
        }

        .cycle-settings label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .cycle-settings input {
            width: 100%;
            min-height: 38px;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.92);
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 12px 28px rgba(28, 39, 49, 0.12);
        }

        .change-date-button {
            min-height: 34px;
            margin-top: 6px;
            padding: 6px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.92);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(28, 39, 49, 0.08);
        }

        .change-date-button:hover {
            color: var(--ink);
        }

        .date-dialog {
            width: min(360px, calc(100vw - 32px));
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .date-dialog::backdrop {
            background: rgba(16, 20, 24, 0.35);
        }

        .date-dialog h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        .date-dialog label {
            display: grid;
            gap: 6px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .date-dialog input {
            min-height: 38px;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: var(--surface);
            font: inherit;
        }

        .date-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }

        .date-dialog-actions button {
            min-height: 36px;
            padding: 7px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .date-dialog-actions button[type="submit"] {
            border-color: var(--today);
            color: #ffffff;
            background: var(--today);
        }

        .date-dialog-actions button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .date-dialog-message {
            min-height: 18px;
            margin: 12px 0 0;
            color: var(--no);
            font-size: 13px;
        }

        .date-dialog-message.is-success {
            color: var(--yes);
        }

        .status-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: clamp(20px, 4vw, 34px) 0 0;
        }

        .status-chip {
            padding: 8px 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-soft);
            color: var(--muted);
            font-size: clamp(13px, 1.8vw, 17px);
            font-weight: 700;
        }

        .eyebrow {
            margin: 0;
            font-size: clamp(18px, 2.4vw, 30px);
            font-weight: 700;
            color: var(--muted);
        }

        .answer {
            margin: clamp(22px, 4vw, 36px) 0 0;
            font-size: clamp(90px, 24vw, 230px);
            line-height: 0.9;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .answer.yes {
            color: var(--yes);
        }

        .answer.no {
            color: var(--no);
        }

        .cycle-day {
            margin: clamp(18px, 3vw, 30px) auto 0;
            width: fit-content;
            padding: 10px 16px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: clamp(22px, 4.2vw, 52px);
            font-weight: 700;
        }

        .hint {
            margin: clamp(22px, 4vw, 36px) 0 0;
            color: var(--muted);
            font-size: clamp(16px, 2vw, 20px);
        }

        .calendar-screen {
            grid-template-rows: auto minmax(0, 1fr);
            gap: clamp(8px, 1.5vh, 14px);
            overflow: hidden;
            padding: clamp(12px, 2.2vw, 28px);
            max-width: 1440px;
            width: 100%;
            margin: auto;
        }

        .calendar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 0;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(19, 29, 38, 0.94);
            box-shadow: 0 10px 28px rgba(28, 39, 49, 0.08);
        }

        .calendar-title {
            margin: 0;
            font-size: clamp(26px, 4.3vw, 56px);
            line-height: 1;
        }

        .calendar-subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: clamp(14px, 1.8vw, 18px);
        }

        .calendar-legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 9px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: clamp(12px, 1.5vw, 15px);
            font-weight: 700;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--yes);
        }

        .legend-dot.is-break {
            background: var(--no);
        }

        .calendar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .current-month-button,
        .next-month-button {
            min-height: 40px;
            padding: 8px 14px;
            border: 1px solid var(--today);
            border-radius: 8px;
            background: var(--today);
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
        }

        .current-month-button {
            background: var(--surface);
            color: var(--today);
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-template-rows: auto repeat(var(--calendar-rows), minmax(0, 1fr));
            gap: clamp(4px, 0.8vw, 10px);
            min-height: 0;
        }

        .weekday,
        .day {
            border-radius: 8px;
        }

        .weekday {
            padding: clamp(5px, 1vh, 9px) 4px;
            text-align: center;
            color: var(--muted);
            background: transparent;
            border: 1px solid transparent;
            font-size: clamp(11px, 1.4vw, 16px);
            font-weight: 700;
        }

        .day {
            min-height: 0;
            padding: clamp(6px, 1vw, 12px);
            border: 1px solid var(--line);
            background: rgba(19, 29, 38, 0.88);
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: clamp(3px, 0.7vh, 8px);
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(28, 39, 49, 0.05);
        }

        .day.is-empty {
            background: transparent;
            border-color: transparent;
        }

        .day.is-pill {
            background: var(--yes-soft);
            border-color: #a8dfc4;
        }

        .day.is-break {
            background: var(--no-soft);
            border-color: #f5b8b1;
        }

        .day.is-today {
            border: 3px solid var(--today);
            padding: clamp(4px, 0.85vw, 10px);
        }

        .date {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .number {
            font-size: clamp(20px, 3.2vw, 42px);
            font-weight: 700;
            line-height: 1;
        }

        .month {
            color: var(--muted);
            font-size: clamp(11px, 1.3vw, 15px);
        }

        .status {
            align-self: center;
            width: fit-content;
            padding: clamp(4px, 0.8vw, 7px) clamp(7px, 1vw, 10px);
            border-radius: 8px;
            font-size: clamp(14px, 1.7vw, 21px);
            font-weight: 700;
        }

        .is-pill .status {
            color: var(--yes);
            background: rgba(22, 120, 75, 0.12);
        }

        .is-break .status {
            color: var(--no);
            background: rgba(165, 39, 39, 0.12);
        }

        .cycle {
            color: var(--muted);
            font-size: clamp(11px, 1.3vw, 15px);
            font-weight: 700;
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            .app {
                padding: 0;
            }

            .calendar-head {
                align-items: center;
            }

            .calendar-subtitle {
                display: none;
            }

            .cycle-settings {
                position: static;
                width: min(190px, 100%);
                margin-bottom: 14px;
                justify-self: end;
            }

            .current-month-button,
            .next-month-button {
                min-height: 34px;
                padding: 6px 9px;
                font-size: 13px;
            }

            .calendar {
                gap: 3px;
            }

            .month,
            .cycle {
                display: none;
            }

            .number {
                font-size: clamp(18px, 6vw, 30px);
            }

            .status {
                padding: 3px 5px;
                font-size: clamp(12px, 3.6vw, 16px);
            }
        }

        @media (max-height: 620px) {
            .calendar-subtitle,
            .calendar-legend,
            .month,
            .cycle {
                display: none;
            }

            .calendar-title {
                font-size: clamp(22px, 5vh, 34px);
            }

        }
    </style>
</head>
<body>
    <main class="app" id="app" aria-live="polite">
        <section class="screen home is-active" id="home">
            <div class="home-card">
                <div class="cycle-settings" id="cycleSettings">
                    <label for="cycleStartInput">Start cyklu</label>
                    <input type="date" id="cycleStartInput" aria-label="Data startu cyklu" readonly>
                    <button class="change-date-button" type="button" id="changeDateButton">Zmień datę</button>
                </div>
                <div class="home-content">
                    <p class="eyebrow">Tabletka dzisiaj</p>
                    <h1 class="answer" id="todayAnswer">...</h1>
                    <p class="cycle-day" id="todayCycleDay"></p>
                    <div class="status-strip" aria-hidden="true">
                        <span class="status-chip">21 dni tabletki</span>
                        <span class="status-chip">7 dni przerwy</span>
                    </div>
                    <p class="hint">Kliknij, żeby zobaczyć cały miesiąc.</p>
                </div>
            </div>
        </section>

        <section class="screen calendar-screen" id="calendarScreen">
            <header class="calendar-head">
                <div>
                    <h2 class="calendar-title" id="calendarTitle"></h2>
                    <p class="calendar-subtitle" id="calendarSubtitle"></p>
                    <div class="calendar-legend" aria-hidden="true">
                        <span class="legend-item"><span class="legend-dot"></span>Tabletka</span>
                        <span class="legend-item"><span class="legend-dot is-break"></span>Przerwa</span>
                    </div>
                </div>
                <div class="calendar-actions">
                    <button class="current-month-button" type="button" id="currentMonthButton">Obecny miesiąc</button>
                    <button class="next-month-button" type="button" id="nextMonthButton">Następny miesiąc</button>
                </div>
            </header>
            <div class="calendar" id="calendar"></div>
        </section>
    </main>

    <dialog class="date-dialog" id="dateDialog">
        <form id="dateForm">
            <h2>Zmień datę</h2>
            <label>
                Hasło
                <input type="password" id="adminPassword" autocomplete="current-password" required>
            </label>
            <label>
                Nowa data
                <input type="date" id="newCycleStart" required>
            </label>
            <p class="date-dialog-message" id="dateDialogMessage" role="alert"></p>
            <div class="date-dialog-actions">
                <button type="button" id="cancelDateButton">Anuluj</button>
                <button type="submit">Zapisz</button>
            </div>
        </form>
    </dialog>

    <script src="config.js"></script>
    <script>
        const defaultCycleStart = new Date(2024, 6, 21);
        let cycleStart = defaultCycleStart;
        let isLoadingCycleStart = true;
        const cycleApiUrl = window.TABLETKI_CONFIG && window.TABLETKI_CONFIG.apiUrl;
        const today = new Date();
        let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const monthNames = [
            "stycznia",
            "lutego",
            "marca",
            "kwietnia",
            "maja",
            "czerwca",
            "lipca",
            "sierpnia",
            "września",
            "października",
            "listopada",
            "grudnia"
        ];
        const monthTitleNames = [
            "Styczeń",
            "Luty",
            "Marzec",
            "Kwiecień",
            "Maj",
            "Czerwiec",
            "Lipiec",
            "Sierpień",
            "Wrzesień",
            "Październik",
            "Listopad",
            "Grudzień"
        ];
        const weekdayNames = ["Pn", "Wt", "Śr", "Cz", "Pt", "Sb", "Nd"];

        function formatInputDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function parseInputDate(value) {
            if (!value) {
                return null;
            }

            const [year, month, day] = value.split("-").map(Number);
            const date = new Date(year, month - 1, day);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function startOfDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function daysBetween(fromDate, toDate) {
            const dayLength = 24 * 60 * 60 * 1000;
            return Math.floor((startOfDay(toDate) - startOfDay(fromDate)) / dayLength);
        }

        function cycleDayFor(date) {
            const difference = daysBetween(cycleStart, date);
            return ((difference % 28) + 28) % 28 + 1;
        }

        function takesPill(date) {
            return cycleDayFor(date) <= 21;
        }

        function showScreen(screenName) {
            document.getElementById("home").classList.toggle("is-active", screenName === "home");
            document.getElementById("calendarScreen").classList.toggle("is-active", screenName === "calendar");
        }

        function renderHome() {
            const answer = document.getElementById("todayAnswer");
            const cycleDay = cycleDayFor(today);
            const isPillDay = takesPill(today);

            answer.textContent = isPillDay ? "TAK" : "NIE";
            answer.classList.toggle("yes", isPillDay);
            answer.classList.toggle("no", !isPillDay);
            document.getElementById("todayCycleDay").textContent = `Dzień cyklu: ${cycleDay}`;
        }

        function createElement(tagName, className, text) {
            const element = document.createElement(tagName);
            element.className = className;
            if (text) {
                element.textContent = text;
            }
            return element;
        }

        function renderCalendar() {
            const calendar = document.getElementById("calendar");
            const year = visibleMonth.getFullYear();
            const month = visibleMonth.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1);
            const mondayOffset = (firstDay.getDay() + 6) % 7;
            const calendarRows = Math.ceil((mondayOffset + daysInMonth) / 7);

            document.getElementById("calendarTitle").textContent = `${monthTitleNames[month]} ${year}`;
            document.getElementById("calendarSubtitle").textContent = "Tak = dzień tabletki. Nie = przerwa.";
            calendar.style.setProperty("--calendar-rows", calendarRows);
            calendar.replaceChildren();

            weekdayNames.forEach((name) => {
                calendar.appendChild(createElement("div", "weekday", name));
            });

            for (let i = 0; i < mondayOffset; i++) {
                calendar.appendChild(createElement("div", "day is-empty"));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const cycleDay = cycleDayFor(date);
                const isPillDay = takesPill(date);
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                const tile = createElement("article", `day ${isPillDay ? "is-pill" : "is-break"} ${isToday ? "is-today" : ""}`);

                const dateLine = createElement("div", "date");
                dateLine.appendChild(createElement("span", "number", String(day)));
                dateLine.appendChild(createElement("span", "month", monthNames[month]));

                tile.appendChild(dateLine);
                tile.appendChild(createElement("div", "status", isPillDay ? "Tak" : "Nie"));
                tile.appendChild(createElement("div", "cycle", `Dzień ${cycleDay}`));
                tile.setAttribute("aria-label", `${day} ${monthNames[month]}: tabletka ${isPillDay ? "tak" : "nie"}, dzień cyklu ${cycleDay}`);

                calendar.appendChild(tile);
            }
        }

        function updateCycleStart(value) {
            const nextCycleStart = parseInputDate(value);

            if (!nextCycleStart) {
                return;
            }

            cycleStart = nextCycleStart;
            document.getElementById("cycleStartInput").value = value;
            renderHome();
            renderCalendar();
        }

        async function readApiResponse(response, fallbackMessage) {
            const responseText = await response.text();
            let data = {};

            try {
                data = responseText ? JSON.parse(responseText) : {};
            } catch (error) {
                data = {};
            }

            if (!response.ok) {
                throw new Error(data.error || data.message || `${fallbackMessage} (HTTP ${response.status}).`);
            }

            return data;
        }

        function getNetworkErrorMessage(error) {
            if (error instanceof TypeError && error.message === "Failed to fetch") {
                return "Nie udało się połączyć z serwerem. Sprawdź połączenie oraz konfigurację CORS funkcji Supabase.";
            }

            return error.message || "Wystąpił nieoczekiwany błąd połączenia.";
        }

        async function loadCycleStart() {
            if (!cycleApiUrl) {
                isLoadingCycleStart = false;
                return;
            }

            try {
                const response = await fetch(cycleApiUrl, { method: "GET" });
                const data = await readApiResponse(response, "Nie udało się pobrać daty");
                if (parseInputDate(data.saved_date)) {
                    updateCycleStart(data.saved_date);
                }
            } catch (error) {
                console.error("Błąd pobierania daty:", error);
            } finally {
                isLoadingCycleStart = false;
                document.getElementById("cycleStartInput").disabled = false;
            }
        }

        async function saveCycleStart(password, value) {
            if (!cycleApiUrl) {
                throw new Error("Brak konfiguracji połączenia z serwerem.");
            }

            let response;

            try {
                response = await fetch(cycleApiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password, date: value })
                });
            } catch (error) {
                throw new Error(getNetworkErrorMessage(error));
            }

            let data;
            try {
                data = await readApiResponse(response, "Nie udało się zapisać daty");
            } catch (error) {
                throw new Error(getNetworkErrorMessage(error));
            }

            if (response.status !== 200 || data.success !== true) {
                throw new Error(data.error || data.message || "Serwer nie potwierdził zapisania daty.");
            }

            if (!parseInputDate(data.saved_date)) {
                throw new Error("Serwer nie zwrócił zapisanej daty.");
            }

            return data.saved_date;
        }

        function showNextMonth() {
            visibleMonth = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1, 1);
            renderCalendar();
        }

        function showCurrentMonth() {
            visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            renderCalendar();
        }

        document.getElementById("cycleStartInput").value = formatInputDate(cycleStart);
        document.getElementById("cycleStartInput").disabled = true;
        document.getElementById("cycleStartInput").addEventListener("click", (event) => {
            event.stopPropagation();
        });
        document.getElementById("cycleSettings").addEventListener("click", (event) => {
            event.stopPropagation();
        });
        const dateDialog = document.getElementById("dateDialog");
        const dateForm = document.getElementById("dateForm");
        const dateDialogMessage = document.getElementById("dateDialogMessage");
        document.getElementById("changeDateButton").addEventListener("click", () => {
            dateForm.reset();
            dateDialogMessage.className = "date-dialog-message";
            dateDialogMessage.textContent = "";
            document.getElementById("newCycleStart").value = formatInputDate(cycleStart);
            dateDialog.showModal();
        });
        document.getElementById("cancelDateButton").addEventListener("click", () => {
            dateDialog.close();
        });
        dateForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.getElementById("adminPassword").value;
            const newCycleStart = document.getElementById("newCycleStart").value;
            const submitButton = dateForm.querySelector("button[type=submit]");
            submitButton.disabled = true;
            submitButton.textContent = "Ładowanie...";
            dateDialogMessage.textContent = "";

            try {
                const savedDate = await saveCycleStart(password, newCycleStart);
                updateCycleStart(savedDate);
                dateDialogMessage.className = "date-dialog-message is-success";
                dateDialogMessage.textContent = "Data została pomyślnie zaktualizowana.";
            } catch (error) {
                dateDialogMessage.className = "date-dialog-message";
                dateDialogMessage.textContent = getNetworkErrorMessage(error);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Zapisz";
            }
        });
        document.getElementById("nextMonthButton").addEventListener("click", (event) => {
            event.stopPropagation();
            showNextMonth();
        });
        document.getElementById("currentMonthButton").addEventListener("click", (event) => {
            event.stopPropagation();
            showCurrentMonth();
        });

        document.getElementById("app").addEventListener("click", () => {
            const isHomeActive = document.getElementById("home").classList.contains("is-active");
            showScreen(isHomeActive ? "calendar" : "home");
        });

        renderHome();
        renderCalendar();
        loadCycleStart();
    </script>
</body>
</html>
